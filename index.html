<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>应用入口</title>
<meta name="description" content="OO 自己做的一些小应用，按类型集合在这一页。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%BF%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&family=Noto+Sans+SC:wght@300;400;500;700&display=swap">
<style>
  *,*::before,*::after{ box-sizing:border-box; }
  :root{
    --bg:#F1EDE6; --panel:#EAE4D9; --hover:#E7E0D2; --raise:#F6F2EA;
    --ink:#17140E; --soft:#787063; --faint:#A79E8E; --hairline:#DBD4C5; --hair2:#CCC2AF;
    --accent:#5B6A38; --accent-2:#D9772E; --accent-soft:rgba(91,106,56,.12);
    --live:#6E7A55; --wip:#C0883C; --down:#B4553C;
    --glass:rgba(251,248,242,.62); --glass-brd:rgba(255,255,255,.7);
    --shadow:0 18px 40px -24px rgba(60,48,24,.5);
  }
  html{ -webkit-text-size-adjust:100%; scroll-behavior:smooth; }
  body{ margin:0; background:var(--bg); color:var(--ink);
    font-family:"Geist","Noto Sans SC",system-ui,sans-serif; font-weight:400; line-height:1.6;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; min-height:100vh; }
  a{ color:inherit; }
  .glow{ position:fixed; inset:0; pointer-events:none; z-index:0;
    background:radial-gradient(70% 45% at 12% -8%, rgba(255,252,244,.7), transparent 55%),
               radial-gradient(45% 40% at 100% 4%, rgba(91,106,56,.06), transparent 60%); }
  .sheet{ position:relative; z-index:1; max-width:1080px; margin:0 auto; padding:0 clamp(22px,5vw,72px); }

  /* ---- 顶栏 ---- */
  .topbar{ display:flex; justify-content:space-between; align-items:center; padding:22px 0;
    font-family:"Geist Mono",monospace; font-size:11.5px; font-weight:500; letter-spacing:.16em; text-transform:uppercase; color:var(--soft); }
  .search-hint{ display:inline-flex; align-items:center; gap:8px; padding:7px 12px; border-radius:999px;
    border:1px solid var(--hairline); background:var(--raise); color:var(--faint); cursor:pointer;
    font-family:"Geist Mono",monospace; font-size:11px; letter-spacing:.08em; transition:border-color .25s, color .25s; }
  .search-hint:hover{ border-color:var(--accent); color:var(--accent); }
  .search-hint kbd{ font-family:"Geist Mono",monospace; font-size:10.5px; padding:1px 6px; border-radius:5px;
    background:var(--panel); border:1px solid var(--hairline); color:var(--soft); }

  /* ---- 报头 ---- */
  .masthead{ padding:clamp(40px,7vw,84px) 0 clamp(30px,5vw,52px); }
  .eyebrow{ margin:0 0 clamp(18px,3vw,26px); font-family:"Geist Mono",monospace; font-size:12px; font-weight:500;
    letter-spacing:.2em; text-transform:uppercase; color:var(--accent); }
  .title-row{ display:flex; align-items:flex-end; gap:clamp(18px,3vw,36px); }
  .title{ margin:0; font-family:"Noto Sans SC","Geist",sans-serif; font-weight:500;
    font-size:clamp(52px,11vw,124px); line-height:.92; letter-spacing:.01em; color:var(--ink); white-space:nowrap; }
  .title-rule{ flex:1; height:1px; background:var(--hair2); margin-bottom:clamp(14px,3vw,32px); }
  .sub-lat{ font-family:"Geist Mono",monospace; font-size:clamp(12px,1.6vw,14px); letter-spacing:.08em;
    text-transform:uppercase; color:var(--faint); margin-bottom:clamp(16px,3vw,34px); white-space:nowrap; }
  .lede{ margin:clamp(24px,4vw,38px) 0 0; max-width:34ch; font-family:"Noto Sans SC",sans-serif; font-weight:300;
    font-size:clamp(15px,2vw,18px); line-height:1.8; color:var(--soft); }

  /* ---- 玻璃分类筛选条 ---- */
  .filterwrap{ position:sticky; top:12px; z-index:30; padding:6px 0 4px; margin-bottom:clamp(20px,3vw,30px); }
  .filterbar{ position:relative; display:flex; gap:2px; padding:6px; border-radius:16px;
    background:var(--glass); border:1px solid var(--glass-brd); box-shadow:var(--shadow);
    backdrop-filter:blur(18px) saturate(1.5); -webkit-backdrop-filter:blur(18px) saturate(1.5);
    overflow-x:auto; scrollbar-width:none; }
  .filterbar::-webkit-scrollbar{ display:none; }
  .pill-ind{ position:absolute; top:6px; height:calc(100% - 12px); border-radius:11px; background:var(--ink);
    box-shadow:0 6px 16px -8px rgba(23,20,14,.6); transition:transform .42s cubic-bezier(.3,.8,.3,1), width .42s cubic-bezier(.3,.8,.3,1); z-index:0; }
  .chip{ position:relative; z-index:1; appearance:none; border:0; background:transparent; cursor:pointer;
    font-family:"Geist Mono",monospace; font-size:12px; font-weight:500; letter-spacing:.04em; white-space:nowrap;
    color:var(--soft); padding:9px 15px; border-radius:11px; transition:color .3s ease; }
  .chip .cnt{ opacity:.5; margin-left:6px; font-size:10.5px; }
  .chip:hover{ color:var(--ink); }
  .chip[aria-selected="true"]{ color:var(--raise); }
  .chip:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  /* ---- 分区 ---- */
  .zone{ margin:0 0 clamp(30px,5vw,52px); transition:opacity .4s ease; }
  .zone.hide{ display:none; }
  .zone-head{ display:flex; align-items:baseline; gap:14px; margin-bottom:18px; }
  .zone-head .zn{ font-family:"Noto Sans SC",sans-serif; font-weight:500; font-size:15px; letter-spacing:.06em; color:var(--ink); }
  .zone-head .ze{ font-family:"Geist Mono",monospace; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--faint); }
  .zone-head .rule{ flex:1; height:1px; background:var(--hairline); }

  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(266px,1fr)); gap:14px; }
  .grid.dim .card::after{ opacity:1; }               /* 邻卡压暗 */
  .card{ position:relative; display:flex; flex-direction:column; gap:11px; padding:20px; border-radius:16px;
    background:var(--panel); border:1px solid var(--hairline); text-decoration:none; color:inherit; overflow:hidden;
    transition:transform .34s cubic-bezier(.2,.7,.3,1), box-shadow .34s ease, border-color .34s ease, background .34s ease;
    --mx:50%; --my:0%; }
  /* 聚光高亮层 */
  .card::before{ content:""; position:absolute; inset:0; border-radius:inherit; opacity:0; pointer-events:none; z-index:0;
    background:radial-gradient(240px 200px at var(--mx) var(--my), rgba(255,255,255,.9), rgba(91,106,56,.10) 40%, transparent 70%);
    transition:opacity .34s ease; }
  /* 邻卡压暗层 */
  .card::after{ content:""; position:absolute; inset:0; border-radius:inherit; background:rgba(40,32,18,.10);
    opacity:0; pointer-events:none; z-index:2; transition:opacity .34s ease; }
  .card:hover::after{ opacity:0 !important; }
  .card > *{ position:relative; z-index:1; }
  .card-top{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .cat-tag{ font-family:"Geist Mono",monospace; font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); }
  .status{ display:inline-flex; align-items:center; gap:7px; font-family:"Geist Mono",monospace;
    font-size:10.5px; font-weight:500; letter-spacing:.1em; text-transform:uppercase; color:var(--soft); white-space:nowrap; }
  .status::before{ content:""; width:6px; height:6px; border-radius:50%; background:var(--live); }
  .status.wip::before{ background:var(--wip); } .status.tg::before{ background:var(--faint); } .status.down::before{ background:var(--down); }
  .name{ margin:0; font-family:"Noto Sans SC",sans-serif; font-weight:500; font-size:20px; letter-spacing:.01em; line-height:1.25; }
  .en{ font-family:"Geist Mono",monospace; font-size:11.5px; letter-spacing:.03em; text-transform:uppercase; color:var(--faint); margin-top:-4px; }
  .desc{ margin:0; font-family:"Noto Sans SC",sans-serif; font-weight:300; font-size:13.5px; line-height:1.7; color:var(--soft); flex:1; }
  .card-foot{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:2px; }
  .url{ font-family:"Geist Mono",monospace; font-size:11px; color:var(--faint); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .arrow{ font-family:"Geist Mono",monospace; font-size:16px; color:var(--accent); transform:translateX(-4px); opacity:0; transition:opacity .3s ease, transform .3s cubic-bezier(.2,.7,.3,1); }
  .card[href]:hover{ transform:translateY(-4px); border-color:var(--glass-brd);
    background:var(--glass); backdrop-filter:blur(10px) saturate(1.4); -webkit-backdrop-filter:blur(10px) saturate(1.4);
    box-shadow:var(--shadow); }
  .card[href]:hover::before{ opacity:1; }
  .card[href]:hover .arrow{ opacity:1; transform:translateX(0); }
  .card[href]:focus-visible{ outline:none; border-color:var(--accent); box-shadow:inset 0 0 0 1.5px var(--accent); }
  .card.static{ } .card.static .name, .card.static .cat-tag{ color:var(--soft); }
  .card.static .desc{ color:var(--faint); }

  /* 滚动揭示 */
  .reveal{ opacity:0; transform:translateY(18px); transition:opacity .7s cubic-bezier(.2,.7,.3,1), transform .7s cubic-bezier(.2,.7,.3,1); }
  .reveal.in{ opacity:1; transform:none; }

  .colophon{ display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;
    padding:26px 0 40px; border-top:1px solid var(--hairline); margin-top:6px;
    font-family:"Geist Mono",monospace; font-size:11px; letter-spacing:.06em; color:var(--faint); }

  /* ---- ⌘K 启动器 ---- */
  .cmd{ position:fixed; inset:0; z-index:100; display:none; align-items:flex-start; justify-content:center;
    padding:14vh 20px 20px; background:rgba(30,24,14,.28); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); }
  .cmd.open{ display:flex; animation:cmdfade .2s ease; }
  @keyframes cmdfade{ from{ opacity:0; } to{ opacity:1; } }
  .cmd-panel{ width:min(560px,100%); border-radius:18px; overflow:hidden; background:var(--glass);
    border:1px solid var(--glass-brd); box-shadow:0 40px 90px -30px rgba(30,20,8,.6);
    backdrop-filter:blur(26px) saturate(1.6); -webkit-backdrop-filter:blur(26px) saturate(1.6); animation:cmdpop .24s cubic-bezier(.2,.8,.3,1); }
  @keyframes cmdpop{ from{ transform:translateY(-10px) scale(.98); opacity:0; } to{ transform:none; opacity:1; } }
  .cmd-in{ display:flex; align-items:center; gap:12px; padding:16px 18px; border-bottom:1px solid var(--hairline); }
  .cmd-in span{ font-family:"Geist Mono",monospace; color:var(--faint); font-size:14px; }
  .cmd-in input{ flex:1; border:0; background:transparent; outline:none; color:var(--ink);
    font-family:"Noto Sans SC","Geist",sans-serif; font-size:17px; font-weight:400; }
  .cmd-in input::placeholder{ color:var(--faint); }
  .cmd-list{ max-height:min(52vh,420px); overflow-y:auto; padding:8px; }
  .cmd-item{ display:flex; align-items:center; gap:12px; padding:11px 13px; border-radius:12px; cursor:pointer; }
  .cmd-item[aria-selected="true"]{ background:var(--hover); }
  .cmd-item .ci-name{ font-family:"Noto Sans SC",sans-serif; font-weight:500; font-size:15px; }
  .cmd-item .ci-en{ font-family:"Geist Mono",monospace; font-size:11px; text-transform:uppercase; color:var(--faint); }
  .cmd-item .ci-cat{ margin-left:auto; font-family:"Geist Mono",monospace; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--accent); }
  .cmd-item .ci-dot{ width:7px; height:7px; border-radius:50%; background:var(--live); flex:none; }
  .cmd-item.wip .ci-dot{ background:var(--wip); } .cmd-item.tg .ci-dot{ background:var(--faint); } .cmd-item.down .ci-dot{ background:var(--down); }
  .cmd-empty{ padding:22px 16px; text-align:center; color:var(--faint); font-family:"Noto Sans SC",sans-serif; font-size:14px; }

  @media (prefers-reduced-motion:reduce){ *{ transition:none !important; animation:none !important; } html{ scroll-behavior:auto; } .reveal{ opacity:1; transform:none; } }
  @media (max-width:720px){ .title-row{ flex-direction:column; align-items:flex-start; gap:6px; } .title-rule,.sub-lat{ display:none; } .search-hint kbd{ display:none; } }
  @media (max-width:560px){ .grid{ grid-template-columns:1fr; } }
</style>
</head>
<body>
<div class="glow"></div>

<div class="sheet">
  <div class="topbar">
    <span>应用入口 / APPS</span>
    <button class="search-hint" id="searchHint">搜索 <kbd>/</kbd></button>
  </div>

  <header class="masthead">
    <p class="eyebrow reveal">A personal collection · 自制应用</p>
    <div class="title-row reveal">
      <h1 class="title">应用入口</h1>
      <span class="sub-lat">the apps</span>
      <span class="title-rule"></span>
    </div>
    <p class="lede reveal">自己做的一些小工具，按类型集合在这一页。</p>
  </header>

  <div class="filterwrap">
    <div class="filterbar" id="filterbar" role="tablist" aria-label="按类型筛选">
      <span class="pill-ind" id="pillInd"></span>
    </div>
  </div>

  <main id="zones"></main>

  <footer class="colophon"><span>自己做的 · 自己用</span><span>OO — 2026</span></footer>
</div>

<!-- ⌘K 启动器 -->
<div class="cmd" id="cmd" role="dialog" aria-modal="true" aria-label="快捷启动">
  <div class="cmd-panel">
    <div class="cmd-in"><span>/</span><input id="cmdInput" type="text" placeholder="搜索应用…" autocomplete="off" spellcheck="false"></div>
    <div class="cmd-list" id="cmdList"></div>
  </div>
</div>

<script>
  const CATS = [
    { id:'body',   name:'身体 · 健康', en:'body & health' },
    { id:'family', name:'家庭 · 宝宝', en:'family & baby' },
    { id:'daily',  name:'记录 · 日常', en:'journal & daily' },
    { id:'play',   name:'爱好 · 玩',   en:'hobby & play' },
    { id:'money',  name:'钱 · 事务',   en:'money & admin' },
    { id:'wip',    name:'施工中',      en:'work in progress' },
    { id:'bg',     name:'后台 · 提醒', en:'background · telegram' },
  ];
  const CATNAME = Object.fromEntries(CATS.map(c=>[c.id,c.name]));

  const APPS = [
    { name:'健身饮食', en:'food & fitness', cat:'body',   desc:'记录三餐的蛋白、碳水、脂肪，连同运动和睡眠，看今天离目标还差多少。', url:'fitness-tracker.vercel.app', href:'https://fitness-tracker.vercel.app', st:'live', label:'Live' },
    { name:'宝宝健康', en:'baby health',    cat:'family', desc:'记录生长曲线、睡眠与生病的病程，发烧时自动提醒复测。', url:'babyhealthlog.vercel.app', href:'https://babyhealthlog.vercel.app', st:'live', label:'Live' },
    { name:'宝宝辅食', en:'baby food',      cat:'family', desc:'像素风游戏化的辅食记录，把每次尝试的食材留下来。', url:'baby-food-adventure.vercel.app', href:'https://baby-food-adventure.vercel.app', st:'live', label:'Live' },
    { name:'日迹',     en:'calendairy',     cat:'daily',  desc:'像素风的每日生活记录，用一组小标签留下一天。', url:'calendairy.vercel.app', href:'https://calendairy.vercel.app', st:'live', label:'Live' },
    { name:'古典音乐', en:'klassik',        cat:'daily',  desc:'古典乐的收听记录，把听过的曲目和感受存下来。', url:'klassik.vercel.app', href:'https://klassik.vercel.app', st:'live', label:'Live' },
    { name:'拼豆配色', en:'bead color match', cat:'play', desc:'拼豆的配色工具，帮你把颜色搭好再动手。', url:'bead-color-match.vercel.app', href:'https://bead-color-match.vercel.app', st:'live', label:'Live' },
    { name:'博饼分账', en:'bobing',         cat:'money',  desc:'每年中秋博饼的记账本，自动算出谁转给谁的最少一笔。', url:'bobing-app.pages.dev', href:'https://bobing-app.pages.dev', st:'live', label:'Live' },
    { name:'转型追踪', en:'career · DE/AE', cat:'wip',    desc:'数据工程转型的学习路径与求职看板。', url:'施工中 · 待部署', href:'', st:'wip', label:'施工中' },
    { name:'虚拟宠物', en:'tamagotchi',     cat:'wip',    desc:'电子宠物养成，喂养、陪伴、慢慢长大。', url:'施工中 · 未部署', href:'', st:'wip', label:'施工中' },
    { name:'关系实验室', en:'relationship lab', cat:'wip', desc:'面向青少年的中英双语视觉小说，讲同意与边界。', url:'施工中 · 未部署', href:'', st:'wip', label:'施工中' },
    { name:'小红书追踪', en:'redbook scout', cat:'bg',    desc:'小红书关键词追踪，命中就经 Telegram 推给我。', url:'Telegram · 无网页', href:'', st:'tg', label:'Telegram' },
    { name:'生活助理', en:'life assistant', cat:'bg',     desc:'长期的人生事项定时提醒，经 Telegram 推送。', url:'Telegram · 无网页', href:'', st:'tg', label:'Telegram' },
  ];

  /* ---------- 渲染分区 ---------- */
  const zonesEl = document.getElementById('zones');
  const usedCats = CATS.filter(c => APPS.some(a => a.cat === c.id));
  zonesEl.innerHTML = usedCats.map(c => {
    const items = APPS.filter(a => a.cat === c.id);
    const cards = items.map(a => {
      const link = !!a.href;
      const tag = link ? `a href="${a.href}" target="_blank" rel="noopener"` : 'div';
      return `<${tag} class="card reveal ${link?'':'static'}" data-cat="${a.cat}">
        <div class="card-top"><span class="cat-tag">${a.en}</span><span class="status ${a.st}">${a.label}</span></div>
        <div><h3 class="name">${a.name}</h3></div>
        <p class="desc">${a.desc}</p>
        <div class="card-foot"><span class="url">${a.url}</span>${link?'<span class="arrow" aria-hidden="true">&rarr;</span>':''}</div>
      </${link?'a':'div'}>`;
    }).join('');
    return `<section class="zone" data-cat="${c.id}">
      <div class="zone-head reveal"><span class="zn">${c.name}</span><span class="ze">${c.en}</span><span class="rule"></span></div>
      <div class="grid">${cards}</div>
    </section>`;
  }).join('');

  /* ---------- 玻璃筛选条 + 滑动指示 ---------- */
  const bar = document.getElementById('filterbar');
  const ind = document.getElementById('pillInd');
  const chipsData = [{id:'all', name:'全部', cnt:APPS.length}, ...usedCats.map(c=>({id:c.id, name:c.name.split(' · ')[0], cnt:APPS.filter(a=>a.cat===c.id).length}))];
  chipsData.forEach(c=>{
    const b=document.createElement('button');
    b.className='chip'; b.setAttribute('role','tab'); b.dataset.cat=c.id;
    b.innerHTML=`${c.name}<span class="cnt">${c.cnt}</span>`;
    bar.appendChild(b);
  });
  const chips=[...bar.querySelectorAll('.chip')];
  function moveInd(chip){ ind.style.width=chip.offsetWidth+'px'; ind.style.transform=`translateX(${chip.offsetLeft-6}px)`; }
  function filter(cat){
    chips.forEach(c=>c.setAttribute('aria-selected', c.dataset.cat===cat));
    document.querySelectorAll('.zone').forEach(z=>{
      const show = cat==='all' || z.dataset.cat===cat;
      z.classList.toggle('hide', !show);
    });
    // 重新触发进场
    requestAnimationFrame(()=>{ document.querySelectorAll('.zone:not(.hide) .reveal').forEach((el,i)=>{ el.classList.remove('in'); void el.offsetWidth; setTimeout(()=>el.classList.add('in'), Math.min(i*28,260)); }); });
    const active=chips.find(c=>c.dataset.cat===cat); if(active) moveInd(active);
  }
  chips.forEach(c=>c.addEventListener('click',()=>filter(c.dataset.cat)));
  window.addEventListener('load',()=>{ const first=chips[0]; first.setAttribute('aria-selected','true'); moveInd(first); });
  window.addEventListener('resize',()=>{ const a=chips.find(c=>c.getAttribute('aria-selected')==='true')||chips[0]; moveInd(a); });

  /* ---------- 聚光高亮 + 邻卡压暗 ---------- */
  document.querySelectorAll('.grid').forEach(grid=>{
    const cards=[...grid.querySelectorAll('.card')];
    cards.forEach(card=>{
      card.addEventListener('mousemove',e=>{ const r=card.getBoundingClientRect(); card.style.setProperty('--mx',((e.clientX-r.left)/r.width*100)+'%'); card.style.setProperty('--my',((e.clientY-r.top)/r.height*100)+'%'); });
      card.addEventListener('mouseenter',()=>grid.classList.add('dim'));
      card.addEventListener('mouseleave',()=>grid.classList.remove('dim'));
    });
  });

  /* ---------- 滚动揭示 ---------- */
  const io=new IntersectionObserver((es)=>{ es.forEach(en=>{ if(en.isIntersecting){ en.target.classList.add('in'); io.unobserve(en.target); } }); }, {threshold:.12, rootMargin:'0px 0px -6% 0px'});
  document.querySelectorAll('.reveal').forEach(el=>io.observe(el));

  /* ---------- ⌘K 启动器 ---------- */
  const cmd=document.getElementById('cmd'), cmdInput=document.getElementById('cmdInput'), cmdList=document.getElementById('cmdList');
  let cmdIdx=0, cmdResults=[];
  function renderCmd(q=''){
    const s=q.trim().toLowerCase();
    cmdResults=APPS.filter(a=> !s || a.name.toLowerCase().includes(s) || a.en.toLowerCase().includes(s) || CATNAME[a.cat].toLowerCase().includes(s));
    cmdIdx=0;
    if(!cmdResults.length){ cmdList.innerHTML=`<div class="cmd-empty">没有匹配的应用</div>`; return; }
    cmdList.innerHTML=cmdResults.map((a,i)=>`<div class="cmd-item ${a.st}" data-i="${i}" aria-selected="${i===0}">
      <span class="ci-dot"></span><span class="ci-name">${a.name}</span><span class="ci-en">${a.en}</span><span class="ci-cat">${CATNAME[a.cat].split(' · ')[0]}</span>
    </div>`).join('');
    [...cmdList.querySelectorAll('.cmd-item')].forEach(it=>{
      it.addEventListener('mousemove',()=>setSel(+it.dataset.i));
      it.addEventListener('click',()=>openItem(+it.dataset.i));
    });
  }
  function setSel(i){ cmdIdx=(i+cmdResults.length)%cmdResults.length; [...cmdList.querySelectorAll('.cmd-item')].forEach((it,idx)=>it.setAttribute('aria-selected', idx===cmdIdx)); const el=cmdList.querySelector('[aria-selected="true"]'); if(el) el.scrollIntoView({block:'nearest'}); }
  function openItem(i){ const a=cmdResults[i]; if(a&&a.href){ window.open(a.href,'_blank','noopener'); closeCmd(); } }
  function openCmd(){ cmd.classList.add('open'); cmdInput.value=''; renderCmd(''); setTimeout(()=>cmdInput.focus(),30); }
  function closeCmd(){ cmd.classList.remove('open'); }
  document.getElementById('searchHint').addEventListener('click',openCmd);
  cmdInput.addEventListener('input',()=>renderCmd(cmdInput.value));
  cmd.addEventListener('click',e=>{ if(e.target===cmd) closeCmd(); });
  document.addEventListener('keydown',e=>{
    if((e.key==='/'||((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k')) && !cmd.classList.contains('open')){
      const t=e.target.tagName; if(t==='INPUT'||t==='TEXTAREA') return; e.preventDefault(); openCmd(); return;
    }
    if(!cmd.classList.contains('open')) return;
    if(e.key==='Escape'){ closeCmd(); }
    else if(e.key==='ArrowDown'){ e.preventDefault(); setSel(cmdIdx+1); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); setSel(cmdIdx-1); }
    else if(e.key==='Enter'){ e.preventDefault(); openItem(cmdIdx); }
  });
</script>
</body>
</html>
